<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ef">
  <meta name="description" content="James Rosko on the web: LinkedIn, GitHub, and NeoSpider.">
  <title>James Rosko</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f5ef;
      --ink: #192a25;
      --muted: #687771;
      --line: #d4ddd5;
      --green: #245d48;
      --orange: #c85b34;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgba(36, 93, 72, .045) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(36, 93, 72, .045) 1px, transparent 1px);
      background-size: 36px 36px;
      font-family: "DM Sans", "Avenir Next", Avenir, sans-serif;
    }

    main {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      justify-content: space-between;
      width: min(100% - 48px, 1056px);
      margin: 0 auto;
      padding: 34px 0 28px;
    }

    .masthead, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 700;
    }

    .mark::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--orange);
      content: "";
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .72fr);
      align-items: center;
      gap: clamp(48px, 10vw, 132px);
      padding: 72px 0;
    }

    .intro { animation: arrive .6s ease-out both; }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(64px, 10vw, 112px);
      font-weight: 400;
      line-height: .94;
    }

    .summary {
      margin: 27px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    nav { animation: arrive .6s .12s ease-out both; }

    .link-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .link-list li { border-bottom: 1px solid var(--line); }

    .link-list a {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 82px;
      color: var(--ink);
      text-decoration: none;
      transition: color .18s ease, padding .18s ease;
    }

    .link-list a:hover, .link-list a:focus-visible {
      padding-left: 6px;
      color: var(--green);
    }

    .link-list a:focus-visible { outline: 2px solid var(--orange); outline-offset: 4px; }

    .number {
      color: var(--orange);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .link-name { font-size: 18px; font-weight: 600; }
    .arrow { font-size: 20px; }
    footer { border-top: 1px solid var(--line); padding-top: 20px; }
    footer span:last-child { text-transform: none; letter-spacing: 0; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 680px) {
      main { width: min(100% - 36px, 480px); padding-top: 24px; }
      .content { grid-template-columns: 1fr; gap: 44px; padding: 74px 0 56px; }
      h1 { font-size: clamp(60px, 17vw, 88px); }
      .summary { font-size: 16px; }
      .link-list a { min-height: 72px; }
      footer { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <span class="mark">James Rosko</span>
      <span>Personal site</span>
    </header>

    <section class="content" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow">Find me around the web</p>
        <h1 id="page-title">James<br>Rosko<span style="color: var(--orange)">.</span></h1>
        <p class="summary">A few places to connect and explore.</p>
      </div>

      <nav aria-label="James Rosko online">
        <ul class="link-list">
          <li>
            <a href="https://www.linkedin.com/in/james-rosko/" target="_blank" rel="noopener noreferrer">
              <span class="number">01</span><span class="link-name">LinkedIn</span><span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a href="https://github.com/jamesrosko" target="_blank" rel="noopener noreferrer">
              <span class="number">02</span><span class="link-name">GitHub</span><span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a href="https://neospider.com" target="_blank" rel="noopener noreferrer">
              <span class="number">03</span><span class="link-name">NeoSpider</span><span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
        </ul>
      </nav>
    </section>

    <footer>
      <span>James Rosko</span>
      <span>© 2026</span>
    </footer>
  </main>
</body>
</html>
